<style>

 --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-display:"Archivo","Manrope",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}

:root[data-theme="dark"]{--bg:#05050C;--fg:#EEF0FF;--muted:#9295B4;--hair:rgba(176,166,255,.10);--surface:rgba(16,15,32,.62);--surface-2:rgba(150,138,255,.075);--surface-solid:#16152B;--accent:#8C7DFF;--accent-2:#B47CFF;--accent-3:#4FD3F0;--accent-soft:rgba(140,125,255,.13);--glow:rgba(124,92,255,.42);--line:rgba(176,166,255,.22);--pop-bg:rgba(22,20,42,.92);--ok:#3ACB86;--warn:#E09C3C;--bad:#FF4D63;--shadow:0 40px 90px -40px rgba(0,0,0,.9);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(40% 35% at 85% 0%,var(--glow),transparent 70%),radial-gradient(35% 30% at 0% 100%,color-mix(in srgb,var(--accent-3) 18%,transparent),transparent 70%);opacity:.7;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.pk,th,.kpi small,.badge,.navb em{font-family:var(--font-mono);letter-spacing:.06em}
.pk{font-size:10.5px;text-transform:uppercase;color:var(--accent);margin:0}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-.02em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));box-shadow:0 12px 28px -14px var(--glow);white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);box-shadow:none}

.btn.sm{height:34px;padding:0 14px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:default}
.panel{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:26px;backdrop-filter:saturate(170%) blur(28px);-webkit-backdrop-filter:saturate(170%) blur(28px);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* login */

.gate .or::before,.gate .or::after{content:"";flex:1;height:1px;background:var(--line)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto;padding:20px}

.tw{overflow:auto;padding:4px 8px 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}

.adm-p{padding:20px 22px;margin-bottom:14px}.adm-t{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:70ch}
.adm-f{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.adm-f .field{flex:1 1 260px}.adm-f .btn{height:42px}

.bl-th{display:block;width:72px;height:38px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.bl-t{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.pe{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.pe-main,.pe-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.pe-p{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.pe-p .pk{margin:0}
.pe-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pe-row input{flex:1 1 200px}
.pe-url{text-transform:none;letter-spacing:0;font-family:var(--font);color:var(--muted);margin-left:6px}.pe-url b{color:var(--accent);font-weight:600}
.pe-h{font-size:12px;color:var(--muted);line-height:1.5}
.pe-tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tb{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer}.tb:hover{border-color:var(--accent);color:var(--accent)}
select.tb{max-width:240px}
#pBody{min-height:520px;font-family:var(--font-mono);font-size:13px;line-height:1.65;height:auto!important;padding:14px!important}
.pe-prev{min-height:520px;padding:18px 22px;border-radius:14px;background:var(--surface-2);font-size:15.5px;line-height:1.7;overflow:auto}
.pe-prev h2{font-size:24px;margin:26px 0 10px}.pe-prev h3{font-size:18px;margin:20px 0 8px}.pe-prev p{margin:0 0 14px}

.pe-prev .cta-b{display:inline-flex;padding:10px 20px;border:1.5px solid var(--fg);border-radius:999px;color:var(--fg);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.pe-cov{border-radius:14px;overflow:hidden;background:var(--surface-2);aspect-ratio:1200/630;display:grid;place-items:center;color:var(--muted);font-size:12.5px}

.pe-up{cursor:pointer}
.pe-acts{display:flex;gap:8px;flex-wrap:wrap}.pe-acts .btn{flex:1 1 auto}
.cnt{font-style:normal;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);letter-spacing:0}.cnt.ok{color:var(--ok)}.cnt.warn{color:var(--bad)}
.serp{padding:14px 16px;border-radius:14px;background:var(--surface-solid);border:1px solid var(--hair)}
.serp p{margin:0}.serp-u{font-size:12px;color:var(--muted)}.serp-t{font-size:18px;color:#1a0dab;line-height:1.3;margin:4px 0!important}[data-theme="dark"] .serp-t{color:#99c3ff}.serp-d{font-size:13px;color:var(--muted);line-height:1.5}
.doc-f{margin-bottom:14px}.doc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.doc-g .wide{grid-column:span 2}
@media (max-width:1000px){.pe{grid-template-columns:1fr}.doc-g{grid-template-columns:1fr}.doc-g .wide{grid-column:auto}}

.bal-warn{padding:14px 18px;margin-bottom:14px;font-size:13.5px;line-height:1.55}.bal-warn.bad{border-color:var(--bad);color:var(--bad)}.bal-warn a,.bal-n a{color:var(--accent)}
.bal-n{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}.bal-n.bad{color:var(--bad)}
.kpi.bad b{color:var(--bad)}
.bal-v .card{margin-bottom:14px}
.kpis5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}

/* drawer */
.dr-bg{position:fixed;inset:0;z-index:40;background:rgba(5,5,14,.45);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.dr{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px,100%);overflow:auto;padding:26px 24px 40px;background:var(--pop-bg);backdrop-filter:saturate(180%) blur(36px);-webkit-backdrop-filter:saturate(180%) blur(36px);border-left:1px solid var(--hair);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dr.in{transform:none}.dr-bg.in{opacity:1}
.dr .x{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:18px}
.dr h2{font-weight:300;font-size:26px;margin:6px 48px 4px 0;word-break:break-all}
.dr .meta{color:var(--muted);font-size:13px;margin-bottom:18px}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair)}
.sec h3{font-size:14px;font-weight:500;margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv span{color:var(--muted)}
.mini{width:100%;font-size:13px}.mini td{padding:8px 6px;cursor:default}
.confirm{margin-top:12px;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 6%,transparent);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:999px;background:var(--pop-bg);border:1px solid var(--hair);box-shadow:var(--shadow);font-size:13.5px;transition:all .25s;pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}
.load{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:12px}.side{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;padding:12px}.side .who,.side .sp{display:none}.logo{width:100%;font-size:28px}.navb{width:auto;padding:9px 12px;font-size:13.5px}.navb em{margin-left:6px}.side-acts{width:100%}.fg{grid-template-columns:1fr}}
</style>
</head>

const GCID='908657032514-nfibgmccqqkb1nn098pps2senl60qdr1.apps.googleusercontent.com';
(async()=>{

async function boot(){
  const {data}=await SB.auth.getSession(); const s=data&&data.session;
  if(!s){ gate('Вхід','Доступ лише для адміністраторів CODE.'); return; }
  const {data:ok,error}=await SB.rpc('is_admin');
  if(error){ gate('Налаштування не завершено',`Ви увійшли як ${s.user.email}, але в базі ще немає таблиць адмінпанелі — потрібно виконати файл admin-setup.sql у Supabase. (${error.message})`,true); return; }
  if(!ok){ gate('Немає доступу',`Акаунт ${s.user.email} не має прав адміністратора.`,true); return; }
  ME=s.user; if(location.hash.includes('access_token')) history.replaceState(null,'',location.pathname);
  $('#gate').hidden=true; $('#app').hidden=false; $('#who').textContent=ME.email;
  await load(); go(VIEW);
}

    SB.from('subscriptions').select('*').limit(5000),

function bars(days){
  const by={}; for(let i=days-1;i>=0;i--) by[isoDay(Date.now()-i*864e5)]=0;
  D.ai.forEach(x=>{ const k=isoDay(x.created_at); if(k in by) by[k]++; });
  const v=Object.values(by), mx=Math.max(1,...v), ks=Object.keys(by);
  return `<div class="bars">${v.map((n,i)=>`<i style="height:${Math.max(2,n/mx*100)}%" title="${ks[i]}: ${n}"></i>`).join('')}</div><div class="bars-x"><span>${ks[0].slice(5)}</span><span>макс. ${mx} / день</span><span>${ks[ks.length-1].slice(5)}</span></div>`;
}

/* ---------- blog ---------- */
const mdEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { u = String(u || '').trim(); return /^(https?:\/\/|\/|#|mailto:)/i.test(u) ? u : '#'; };
function inline(t) {
  let s = mdEsc(t);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, h) => { const u = safeUrl(h.replace(/&amp;/g, '&')); const ext = /^https?:/i.test(u) && !/code-matrix|codematrix/i.test(u); return `<a href="${mdEsc(u)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${a}</a>`; });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'), out = [];
  let para = [], list = null;
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { flushP(); flushL(); continue; }
    let m;
    if ((m = l.match(/^\[\[cta:\s*(.+?)\s*\|\s*(\S+?)\s*\]\]$/i))) { flushP(); flushL(); out.push(`<p class="cta"><a class="cta-b" href="${mdEsc(safeUrl(m[2]))}">${mdEsc(m[1])}</a></p>`); continue; }
    if ((m = l.match(/^\[\[note:\s*(.+?)\s*\]\]$/i))) { flushP(); flushL(); out.push(`<div class="note">${inline(m[1])}</div>`); continue; }
    if ((m = l.match(/^(#{2,4})\s+(.+)$/))) { flushP(); flushL(); const n = m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m = l.match(/^[-*]\s+(.+)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\d+[.)]\s+(.+)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out.join('\n');
}
const plain = src => String(src || '').replace(/\[\[(cta|note):\s*([^|\]]+).*?\]\]/gi, '$2').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[#>*_`-]/g, ' ').replace(/\s+/g, ' ').trim();

function bindPost(){

    const set=(el,html)=>{ const c=el.closest('.field').querySelector('label .cnt'); if(c) c.outerHTML=html; };
    set(h1,cnt(h1.value.length,0,70)); set(tt,cnt(tt.value.length,0,60)); set(ds,cnt(ds.value.length,120,160)); };
  h1.oninput=()=>{ if(!sl.dataset.manual) sl.value=slugify(h1.value); upd(); };

    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''), path=`${sl.value||'post'}-${Date.now()}.${ext}`;
    toast('Завантажуємо фото…'); const {error}=await SB.storage.from('blog').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'31536000'});
    if(error) return toast('Не вдалося завантажити: '+error.message);
    const {data}=SB.storage.from('blog').getPublicUrl(path); cov.value=data.publicUrl; showCov(data.publicUrl); toast('Фото завантажено. Не забудьте зберегти статтю.'); };
  const back=$('[data-post-back]'); if(back) back.onclick=()=>{ EDIT=null; go('blog'); };
  f.onsubmit=async e=>{ e.preventDefault();
    const slug=sl.value.replace(/^-+|-+$/g,''); if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return toast('Перевірте slug: лише латиниця, цифри й дефіси.');

const usd=n=>'$'+(Math.round((n||0)*100)/100).toFixed(2);

function balEst(){
  const top=D.topups.reduce((a,t)=>a+(+t.usd||0),0), from=D.topups.length?D.topups[0].d:null;
  const spent=from?D.spend.filter(x=>isoDay(x.created_at)>=from).reduce((a,x)=>a+(+x.cost||0),0):0;
  const wk=D.spend.filter(x=>new Date(x.created_at)>=Date.now()-7*864e5).reduce((a,x)=>a+(+x.cost||0),0)/7;
  const priced=D.spend.filter(x=>x.cost!=null), avgReq=priced.length?priced.reduce((a,x)=>a+(+x.cost||0),0)/priced.length:0;
  const left=top-spent; return {has:D.topups.length>0,top,spent,left,perDay:wk,days:wk>0?Math.floor(left/wk):null,avgReq,reqLeft:avgReq>0?Math.floor(left/avgReq):null,from};
}
function vBal(){
  const b=balEst(), today=isoDay(Date.now());
  const dayCost=d=>D.spend.filter(x=>isoDay(x.created_at)===d).reduce((a,x)=>a+(+x.cost||0),0);
  const days=[]; for(let i=29;i>=0;i--) days.push(isoDay(Date.now()-i*864e5)); const vals=days.map(dayCost), mx=Math.max(0.0001,...vals);
  const m30=D.spend.filter(x=>new Date(x.created_at)>=Date.now()-30*864e5), noCost=m30.filter(x=>x.cost==null).length;
  const by={}; m30.filter(x=>x.cost!=null).forEach(x=>{ const k=by[x.kind]=by[x.kind]||{n:0,c:0,i:0,o:0}; k.n++; k.c+=+x.cost; k.i+=x.tokens_in||0; k.o+=x.tokens_out||0; });
  const low=b.has&&(b.left<2||(b.days!=null&&b.days<7));
  const kpi=(t,v,s,cls='')=>`<div class="panel kpi ${cls}"><small>${t}</small><b>${v}</b><span>${s||''}</span></div>`;
  return head('Баланс ШІ')+`<div class="bal-v">
  ${b.has?'':'<div class="panel bal-warn">Додайте нижче суму поповнення в Claude Console (і поточний баланс, наприклад $5 на сьогодні) — тоді тут з’явиться орієнтовний залишок і на скільки його вистачить.</div>'}
  ${low?`<div class="panel bal-warn bad">Баланс закінчується: орієнтовно ${usd(b.left)}${b.days!=null?`, вистачить приблизно на ${b.days} дн.`:''} Поповніть у <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">Claude Console → Billing</a>.</div>`:''}
  <div class="kpis kpis5">
    ${kpi('Орієнтовний залишок',b.has?usd(b.left):'—',b.has?`поповнено ${usd(b.top)} з ${fmtD(b.from)}`:'немає даних про поповнення',low?'bad':'')}
    ${kpi('Витрачено',b.has?usd(b.spent):usd(m30.reduce((a,x)=>a+(+x.cost||0),0)),b.has?'з першого поповнення':'за 30 днів')}
    ${kpi('У середньому за день',usd(b.perDay),'за останні 7 днів')}
    ${kpi('Вистачить приблизно',b.days!=null?`${b.days} дн.`:'—',b.reqLeft!=null&&b.has?`≈ ${b.reqLeft} запитів за середньою ціною ${usd(b.avgReq)}`:'')}
    ${kpi('Сьогодні',usd(dayCost(today)),`${D.spend.filter(x=>isoDay(x.created_at)===today).length} запитів`)}
  </div>
  <div class="panel card"><h3>Витрати по днях · 30 днів</h3><div class="bars">${vals.map((v,i)=>`<i style="height:${Math.max(2,v/mx*100)}%" title="${days[i]}: ${usd(v)}"></i>`).join('')}</div><div class="bars-x"><span>${days[0].slice(5)}</span><span>макс. ${usd(Math.max(...vals))} / день</span><span>${days[29].slice(5)}</span></div></div>
  <div class="panel card"><h3>За видами запитів · 30 днів</h3>${Object.keys(by).length?`<div class="tw"><table><thead><tr><th>Вид</th><th>Запитів</th><th>Токени вх / вих</th><th>Разом</th><th>Середня ціна</th></tr></thead><tbody>${Object.entries(by).sort((x,y)=>y[1].c-x[1].c).map(([k,v])=>`<tr><td>${KIND[k]||k}</td><td class="num">${v.n}</td><td class="num">${v.i.toLocaleString('uk-UA')} / ${v.o.toLocaleString('uk-UA')}</td><td class="num">${usd(v.c)}</td><td class="num">$${(v.c/v.n).toFixed(4)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Ще немає запитів із записаною вартістю.</p>'}
    ${noCost?`<p class="bal-n">${noCost} запит(ів) зроблено до того, як почали записувати вартість, — вони тут не враховані.</p>`:''}${D.spendErr?`<p class="bal-n bad">Не вдалося прочитати витрати: ${esc(D.spendErr)}</p>`:''}</div>
  <div class="panel card"><h3>Поповнення балансу Anthropic</h3>
    <form id="tpF" class="adm-f"><div class="field" style="flex:0 1 170px"><label for="tpD">Дата</label><input type="date" id="tpD" value="${today}" required></div><div class="field" style="flex:0 1 140px"><label for="tpU">Сума, $</label><input type="number" id="tpU" min="0.01" step="0.01" placeholder="20" required></div><div class="field"><label for="tpN">Нотатка</label><input id="tpN" placeholder="напр. стартовий баланс"></div><button class="btn go sm" type="submit">Додати</button></form>
    ${D.topups.length?`<div class="tw" style="margin-top:14px"><table><thead><tr><th>Дата</th><th>Сума</th><th>Нотатка</th><th></th></tr></thead><tbody>${D.topups.map((t,i)=>`<tr><td class="num">${fmtD(t.d)}</td><td class="num">${usd(t.usd)}</td><td><small>${esc(t.note||'')}</small></td><td style="text-align:right"><button class="btn ghost sm" data-tp-del="${i}">Прибрати</button></td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="bal-n">Це оцінка за нашими записами: кожен запит до ШІ зберігає кількість токенів і ціну (Sonnet 5.5: $2 за 1 млн вхідних і $10 за 1 млн вихідних токенів). Точний баланс — у <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">Claude Console → Billing</a>; якщо він розходиться з оцінкою, додайте коригувальне поповнення.</p></div></div>`;
}
async function saveTopups(list,act,det){ const {error}=await SB.from('admin_settings').upsert({key:'topups',value:list,updated_at:new Date().toISOString()}); if(error){ toast('Не вдалося зберегти: '+error.message); return false; } await logA(act,null,det); await load(); go('bal'); return true; }
function vAdmins(){
  const me=(ME&&ME.email||'').toLowerCase();
  const row=e=>{ const u=D.users.find(x=>(x.email||'').toLowerCase()===e.toLowerCase()), self=e.toLowerCase()===me;
    return `<tr><td>${esc(e)}${u&&nameOf(u)?`<small>${esc(nameOf(u))}</small>`:''}</td><td>${self?'<span class="badge ok">це ви</span>':u?'<span class="badge ok">акаунт є</span>':'<span class="badge">ще не входив</span>'}</td><td style="text-align:right">${self?'':`<button class="btn ghost sm" data-adm-del="${esc(e)}">Прибрати</button>`}</td></tr>`; };
  return head('Адміністратори')+`<div class="panel adm-p"><p class="adm-t">Адмін входить сюди через Google з указаним email. Додайте свій запасний акаунт, щоб не втратити доступ, якщо основний стане недоступним. Себе прибрати не можна — так адмінка ніколи не залишиться без власника.</p>
    <form id="admF" class="adm-f"><div class="field"><label for="admE">Email Google-акаунта</label><input type="email" id="admE" required autocomplete="off" placeholder="name@gmail.com"></div><button class="btn go sm" type="submit">Додати адміна</button></form></div>
    <div class="panel">${D.admins.length?`<div class="tw"><table><thead><tr><th>Email</th><th>Статус</th><th></th></tr></thead><tbody>${D.admins.map(row).join('')}</tbody></table></div>`:'<p class="empty">Список порожній.</p>'}</div>`;
}
function bindView(){
  bindPost(); bindDocs();
  { const nb=$('[data-post-new]'); if(nb) nb.onclick=()=>{ EDIT='new'; go('post'); }; document.querySelectorAll('[data-post-edit]').forEach(b=>b.onclick=()=>{ EDIT=+b.dataset.postEdit; go('post'); window.scrollTo({top:0}); }); }
  { const f=$('#tpF'); if(f) f.onsubmit=async e=>{ e.preventDefault(); const usdv=Math.round(parseFloat($('#tpU').value)*100)/100; if(!(usdv>0)) return toast('Вкажіть суму.');
      const t={d:$('#tpD').value,usd:usdv,note:$('#tpN').value.trim()}; if(await saveTopups([...D.topups,t],'поповнення балансу ШІ',t)) toast('Поповнення додано.'); }; }
  document.querySelectorAll('[data-tp-del]').forEach(b=>b.onclick=async()=>{ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Точно?'; b.classList.add('bad'); return; } const i=+b.dataset.tpDel, t=D.topups[i]; await saveTopups(D.topups.filter((_,k)=>k!==i),'видалено поповнення',t); });
  { const f=$('#admF'); if(f) f.onsubmit=async e=>{ e.preventDefault(); const em=$('#admE').value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('Перевірте email.');
      if(D.admins.some(x=>x.toLowerCase()===em)) return toast('Цей email уже адмін.');
      const {error}=await SB.from('admins').insert({email:em}); if(error) return toast('Не вдалося додати: '+error.message);
      await logA('додано адміна',{email:em},{email:em}); await load(); go('admins'); toast('Адміна додано. Він може входити через Google з цим email.'); }; }
  document.querySelectorAll('[data-adm-del]').forEach(b=>b.onclick=async()=>{ const em=b.dataset.admDel;
    if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Точно прибрати?'; b.classList.add('bad'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent='Прибрати'; b.classList.remove('bad'); } },4000); return; }
    const {error}=await SB.from('admins').delete().eq('email',em); if(error) return toast('Не вдалося прибрати: '+error.message);
    await logA('прибрано адміна',{email:em},{email:em}); await load(); go('admins'); toast('Доступ адміна прибрано.'); });
  const q=$('#q'); if(q){ q.oninput=()=>{ Q=q.value; const pos=q.selectionStart; go('users'); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ SUBF=b.dataset.f; go('subs'); });
  document.querySelectorAll('#main [data-u]').forEach(r=>{ if(r.dataset.u) r.onclick=()=>openUser(r.dataset.u); });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{ const a=b.dataset.act;
    if(a==='reload'){ b.disabled=true; await load(); go(VIEW); toast('Дані оновлено.'); }
    if(a==='csvU') csv('code-users.csv',[['email','name','registered','plan','paid_until','auto_renew','packs','ai_30d','readings']].concat(D.users.map(u=>{const s=D.subs[u.id]||{};return [u.email,nameOf(u),fmtD(u.created_at),planOf(u.id),s.paid_until?fmtD(s.paid_until):'',s.auto_renew?'yes':'',s.packs||0,aiFor(u.id),u.readings];})));
    if(a==='csvP') csv('code-payments.csv',[['date','email','kind','plan','period','amount','provider','ref','note']].concat(D.pays.map(p=>[fmtDT(p.created_at),p.email,p.kind,p.plan||'',p.period||'',p.kind==='refund'?-p.amount:p.amount,p.provider||'',p.provider_ref||'',p.note||''])));
  });
}
function csv(name,rows){ const t='﻿'+rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }

/* ---------- user card ---------- */
function openUser(id){
  const u=userById(id)||{id,email:(D.subs[id]||{}).email||'',profile:{}}, s=D.subs[id]||{user_id:id,plan:'free',period:'m',paid_until:null,auto_renew:false,packs:0,pack_reports:0,note:''};
  const pays=D.pays.filter(p=>p.user_id===id), ai=D.ai.filter(x=>x.user_id===id), pr=u.profile||{};
  const dateVal=s.paid_until?isoDay(s.paid_until):'';
  const bg=document.createElement('div'); bg.className='dr-bg'; const d=document.createElement('aside'); d.className='dr'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML=`<button class="x" type="button" aria-label="Закрити">×</button>
    <p class="pk">[ користувач ]</p><h2>${esc(u.email||'—')}</h2>
    <div class="meta">${badge(planOf(id))} ${statusBadge(s)} · зареєстрований ${fmtD(u.created_at)}</div>
    <div class="kv"><span>Ім’я</span><b>${esc(pr.name||'—')}</b><span>Дата народження</span><b>${pr.d?`${String(pr.d).padStart(2,'0')}.${String(pr.m).padStart(2,'0')}.${pr.y}`:'—'}</b><span>Стать</span><b>${pr.g==='m'?'чоловік':pr.g==='f'?'жінка':'—'}</b><span>Збережені коди</span><b>${u.saved||0}</b><span>Розклади Таро</span><b>${u.readings||0}</b><span>ШІ-запити · 30 дн</span><b>${aiFor(id)} (розклади ${ai.filter(x=>x.kind==='reading').length}, уточнення ${ai.filter(x=>x.kind==='follow').length}, фото ${ai.filter(x=>x.kind==='photo').length})</b><span>ID</span><b class="mono" style="font-size:11px">${esc(id)}</b></div>

    <div class="sec"><h3>Підписка</h3>
      <div class="fg">
        <div class="field"><label for="sPlan">Тариф</label><select id="sPlan"><option value="free"${s.plan==='free'?' selected':''}>Free</option><option value="plus"${s.plan==='plus'?' selected':''}>Plus · 199 грн</option><option value="pro"${s.plan==='pro'?' selected':''}>Pro · 549 грн</option></select></div>
        <div class="field"><label for="sPer">Період</label><select id="sPer"><option value="m"${s.period!=='y'?' selected':''}>Місяць</option><option value="y"${s.period==='y'?' selected':''}>Рік</option></select></div>
        <div class="field"><label for="sUntil">Діє до</label><input type="date" id="sUntil" value="${dateVal}"></div>
        <div class="field"><label for="sPacks">Пакетних запитів до ШІ</label><input type="number" id="sPacks" min="0" step="1" value="${s.packs||0}"></div><div class="field"><label for="sPackR">Пакетних розборів матриці</label><input type="number" id="sPackR" min="0" step="1" value="${s.pack_reports||0}"></div>
        <label class="chk full"><input type="checkbox" id="sAuto"${s.auto_renew?' checked':''}> Автопродовження (лише за згодою користувача)</label>
        <div class="field full"><label for="sNote">Нотатка (бачите лише ви)</label><textarea id="sNote">${esc(s.note||'')}</textarea></div>
      </div>
      <div class="row"><button class="btn ghost sm" data-q="m">+30 днів</button><button class="btn ghost sm" data-q="y">+1 рік</button><button class="btn ghost sm" data-q="p10">+ Пакет (10 запитів + 1 розбір)</button><button class="btn ghost sm" data-q="r1">+1 розбір</button><button class="btn ghost sm" data-q="noauto">Вимкнути автопродовження</button><button class="btn bad sm" data-q="cancel">Скасувати зараз</button></div>
      <div class="row"><button class="btn" id="sSave">Зберегти підписку</button></div>
    </div>

    <div class="sec"><h3>Додати запис про оплату</h3>
      <div class="fg"><div class="field"><label for="pAmt">Сума, грн</label><input type="number" id="pAmt" min="0" step="1" value="${PRICE[s.plan]?PRICE[s.plan][s.period||'m']:''}"></div>
        <div class="field"><label for="pKind">Тип</label><select id="pKind"><option value="manual">Ручна оплата</option><option value="pack">Пакет</option><option value="refund">Повернення</option></select></div>
        <div class="field full"><label for="pNote">Коментар</label><input id="pNote" placeholder="Напр.: переказ на картку, подарунок, компенсація"></div></div>
      <div class="row"><button class="btn ghost sm" id="pAdd">Додати запис</button></div>
      ${pays.length?`<table class="mini" style="margin-top:12px"><tbody>${pays.map(p=>`<tr><td class="num">${fmtD(p.created_at)}</td><td>${{payment:'оплата',manual:'вручну',refund:'повернення',pack:'пакет'}[p.kind]}</td><td class="num ${p.kind==='refund'?'neg':''}">${p.kind==='refund'?'−':''}${uah(p.amount)}</td><td><small>${esc(p.note||'')}</small></td></tr>`).join('')}</tbody></table>`:'<p style="color:var(--muted);font-size:13px;margin:10px 0 0">Оплат ще не було.</p>'}
    </div>

    <div class="sec"><h3>Дані користувача</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 10px">Видаляє профіль, збережені коди, історію, розклади й підписку. Сам акаунт для входу видаляється в Supabase → Authentication → Users.</p>
      <button class="btn bad sm" id="uDel">Видалити дані користувача</button><div id="uDelC"></div>
    </div>`;
  document.body.append(bg,d); requestAnimationFrame(()=>{bg.classList.add('in');d.classList.add('in');});
  const close=()=>{ bg.classList.remove('in'); d.classList.remove('in'); setTimeout(()=>{bg.remove();d.remove();},300); document.removeEventListener('keydown',key); };
  const key=e=>{ if(e.key==='Escape') close(); }; document.addEventListener('keydown',key);
  bg.onclick=close; d.querySelector('.x').onclick=close;
  const until=d.querySelector('#sUntil');
  const base=()=>{ const v=until.value?new Date(until.value+'T23:59:00'):null; return v&&v>new Date()?v:new Date(); };
  d.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const q=b.dataset.q;
    if(q==='m'||q==='y'){ const x=base(); if(q==='m') x.setDate(x.getDate()+30); else x.setFullYear(x.getFullYear()+1); until.value=isoDay(x); if(d.querySelector('#sPlan').value==='free') d.querySelector('#sPlan').value='plus'; d.querySelector('#sPer').value=q; }
    if(q==='p10'){ d.querySelector('#sPacks').value=(+d.querySelector('#sPacks').value||0)+10; d.querySelector('#sPackR').value=(+d.querySelector('#sPackR').value||0)+1; }
    if(q==='r1') d.querySelector('#sPackR').value=(+d.querySelector('#sPackR').value||0)+1;
    if(q==='noauto') d.querySelector('#sAuto').checked=false;
    if(q==='cancel'){ d.querySelector('#sPlan').value='free'; d.querySelector('#sAuto').checked=false; until.value=isoDay(new Date()); }
    toast('Змінено у формі — натисніть «Зберегти підписку».'); });
  d.querySelector('#sSave').onclick=async e=>{ const b=e.currentTarget; b.disabled=true;
    const plan=d.querySelector('#sPlan').value, per=d.querySelector('#sPer').value, uv=until.value;
    const row={user_id:id,email:u.email,plan,period:per,paid_until:uv?new Date(uv+'T23:59:00').toISOString():null,auto_renew:d.querySelector('#sAuto').checked,packs:Math.max(0,parseInt(d.querySelector('#sPacks').value||'0',10)),pack_reports:Math.max(0,parseInt(d.querySelector('#sPackR').value||'0',10)),note:d.querySelector('#sNote').value.trim()||null,updated_at:new Date().toISOString(),started_at:s.started_at||(plan!=='free'?new Date().toISOString():null)};
    if(plan!=='free'&&!row.paid_until){ toast('Вкажіть дату «Діє до».'); b.disabled=false; return; }
    const {error}=await SB.from('subscriptions').upsert(row);
    if(error){ toast('Не вдалося зберегти: '+error.message); b.disabled=false; return; }
    await logA('підписка змінена',u,{from:{plan:s.plan,until:s.paid_until?isoDay(s.paid_until):null,auto:s.auto_renew,packs:s.packs,reports:s.pack_reports||0},to:{plan,until:uv||null,auto:row.auto_renew,packs:row.packs,reports:row.pack_reports}});
    D.subs[id]=row; toast('Підписку збережено.'); close(); await load(); go(VIEW); };
  d.querySelector('#pAdd').onclick=async e=>{ const b=e.currentTarget, amt=parseInt(d.querySelector('#pAmt').value||'0',10), kind=d.querySelector('#pKind').value;
    if(!(amt>0)){ toast('Вкажіть суму.'); return; } b.disabled=true;
    const {error}=await SB.from('payments').insert({user_id:id,email:u.email,amount:amt,kind,plan:kind==='pack'?null:d.querySelector('#sPlan').value,period:kind==='pack'?null:d.querySelector('#sPer').value,provider:'admin',note:d.querySelector('#pNote').value.trim()||null});
    if(error){ toast('Не вдалося: '+error.message); b.disabled=false; return; }
    await logA(kind==='refund'?'повернення записано':'оплату записано',u,{amount:amt,kind}); toast('Запис додано.'); close(); await load(); go(VIEW); };
  d.querySelector('#uDel').onclick=()=>{ const c=d.querySelector('#uDelC'); c.innerHTML=`<div class="confirm">Щоб підтвердити, введіть email користувача:<div class="field" style="margin-top:8px"><input id="uDelE" placeholder="${esc(u.email)}"></div><div class="row"><button class="btn bad sm" id="uDelGo">Видалити назавжди</button></div></div>`;
    c.querySelector('#uDelGo').onclick=async()=>{ if(c.querySelector('#uDelE').value.trim().toLowerCase()!==(u.email||'').toLowerCase()){ toast('Email не збігається.'); return; }
      const r1=await SB.from('subscriptions').delete().eq('user_id',id), r2=await SB.from('user_data').delete().eq('id',id);
      if(r1.error||r2.error){ toast('Помилка: '+(r1.error||r2.error).message); return; }
      await logA('дані користувача видалено',u,null); toast('Дані видалено.'); close(); await load(); go(VIEW); }; };
}

SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN'&&$('#app').hidden) boot(); });
boot();
})();
</script>
