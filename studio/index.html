<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CODE · Адмінпанель</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem("code-theme")||"null");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#ECEFFA;--fg:#14162B;--muted:#6A6F8C;--hair:rgba(52,62,140,.09);--surface:rgba(255,255,255,.64);--surface-2:rgba(92,104,190,.075);--surface-solid:#fff;--accent:#4F5BF2;--accent-2:#8A5CF6;--accent-3:#2BBBE6;--accent-soft:rgba(79,91,242,.09);--glow:rgba(110,118,255,.30);--line:rgba(70,80,170,.20);--pop-bg:rgba(250,251,255,.86);--ok:#178F5B;--warn:#C9862A;--bad:#D33A4F;--shadow:0 30px 70px -34px rgba(46,56,140,.35),0 2px 8px rgba(46,56,140,.05);
 --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-display:"Archivo","Manrope",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05050C;--fg:#EEF0FF;--muted:#9295B4;--hair:rgba(176,166,255,.10);--surface:rgba(16,15,32,.62);--surface-2:rgba(150,138,255,.075);--surface-solid:#16152B;--accent:#8C7DFF;--accent-2:#B47CFF;--accent-3:#4FD3F0;--accent-soft:rgba(140,125,255,.13);--glow:rgba(124,92,255,.42);--line:rgba(176,166,255,.22);--pop-bg:rgba(22,20,42,.92);--ok:#3ACB86;--warn:#E09C3C;--bad:#FF4D63;--shadow:0 40px 90px -40px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05050C;--fg:#EEF0FF;--muted:#9295B4;--hair:rgba(176,166,255,.10);--surface:rgba(16,15,32,.62);--surface-2:rgba(150,138,255,.075);--surface-solid:#16152B;--accent:#8C7DFF;--accent-2:#B47CFF;--accent-3:#4FD3F0;--accent-soft:rgba(140,125,255,.13);--glow:rgba(124,92,255,.42);--line:rgba(176,166,255,.22);--pop-bg:rgba(22,20,42,.92);--ok:#3ACB86;--warn:#E09C3C;--bad:#FF4D63;--shadow:0 40px 90px -40px rgba(0,0,0,.9);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(40% 35% at 85% 0%,var(--glow),transparent 70%),radial-gradient(35% 30% at 0% 100%,color-mix(in srgb,var(--accent-3) 18%,transparent),transparent 70%);opacity:.7;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.pk,th,.kpi small,.badge,.navb em{font-family:var(--font-mono);letter-spacing:.06em}
.pk{font-size:10.5px;text-transform:uppercase;color:var(--accent);margin:0}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-.02em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));box-shadow:0 12px 28px -14px var(--glow);white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.bad{background:none;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad);box-shadow:none}
.btn.sm{height:34px;padding:0 14px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:default}
.panel{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:26px;backdrop-filter:saturate(170%) blur(28px);-webkit-backdrop-filter:saturate(170%) blur(28px);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{height:42px;padding:0 14px;border-radius:14px;border:1px solid transparent;background:var(--surface-2);font-size:14px}
.field textarea{height:72px;padding:10px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface-solid)}

/* login */
.gate{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:20px}
.gate .panel{width:min(420px,100%);padding:32px 28px}
.gate h1{font-weight:300;font-size:30px;margin:6px 0 8px}
.gate p{color:var(--muted);margin:0 0 18px;font-size:14px}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate .btn{width:100%}
.gate .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin:6px 0}
.gate .or::before,.gate .or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13px}

/* app */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto;padding:20px}
.side{position:sticky;top:20px;align-self:start;padding:20px 14px;display:flex;flex-direction:column;gap:4px;max-height:calc(100svh - 40px);overflow:auto}
.logo{font-family:var(--font-display);font-weight:300;font-size:34px;letter-spacing:-.05em;padding:0 10px}
.logo sup{font-size:11px;font-family:var(--font-mono);letter-spacing:.06em;color:var(--accent);margin-left:6px}
.who{padding:2px 10px 16px;font-size:12px;color:var(--muted);word-break:break-all}
.navb{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:none;border-radius:14px;text-align:left;cursor:pointer;font-size:14.5px;color:var(--fg)}
.navb:hover{background:var(--surface-2)}
.navb.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.navb em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--muted)}
.side .sp{flex:1;min-height:16px}
.side-acts{display:flex;gap:8px;padding:8px 6px 0;border-top:1px solid var(--hair);margin-top:10px}
.side-acts .btn{flex:1}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 0}
.top h2{font-weight:200;font-size:clamp(28px,3.4vw,42px)}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.pt-code{font-family:var(--font-mono);font-size:12.5px;padding:3px 8px;border-radius:8px;background:var(--accent-soft)}
.pt-chev{display:inline-block;width:12px;color:var(--muted)}
.pt-row.on td{background:var(--surface-2)}
.pt-sub>td{background:var(--surface-2);padding:6px 18px 16px!important}
.i18-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:12px}
.i18-l{border:1px solid var(--hair);border-radius:18px;padding:16px 18px;background:var(--surface-2)}
.i18-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.i18-h strong{font-size:15px}
.i18-tot,.i18-row{display:grid;grid-template-columns:1fr 44px auto;align-items:center;gap:8px}
.i18-tot{min-width:150px}
.i18-row{grid-template-columns:130px 1fr 44px 70px;font-size:12.5px;color:var(--muted);margin-top:6px}
.i18-tot{grid-template-columns:90px 44px 0}
.i18-tot small{display:none}
.i18-bar{height:7px;border-radius:99px;background:var(--hair);overflow:hidden}
.i18-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.i18-row b,.i18-tot b{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.i18-row small{font-family:var(--font-mono);font-size:10.5px;text-align:right}
.an-chips{display:flex;gap:6px;flex-wrap:wrap}
.an-list{display:flex;flex-direction:column;gap:9px}
.an-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(60px,1fr) 44px 40px;gap:10px;align-items:center;font-size:13.5px}
.an-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-b{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.an-b i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.an-r b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.an-r small{color:var(--muted);text-align:right;font-family:var(--font-mono);font-size:11px}
.utm-out{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.utm-out code{flex:1 1 300px;min-width:0;padding:11px 14px;border-radius:12px;background:var(--surface-2);font-family:var(--font-mono);font-size:12.5px;word-break:break-all}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 20px}
.kpi small{display:block;font-size:10px;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-display);font-weight:300;font-size:32px;letter-spacing:-.02em;margin-top:6px}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.card{padding:20px 22px}
.card h3{font-weight:400;font-size:18px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.bars i{flex:1;min-width:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(0deg,var(--accent),var(--accent-2),var(--accent-3));opacity:.85;position:relative}
.bars i:hover{opacity:1}
.bars-x{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px}
.tools input[type=search]{flex:1 1 240px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.tw{overflow:auto;padding:4px 8px 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:9.5px;font-weight:400;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--hair);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td small{display:block;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;text-transform:uppercase;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.plus{background:var(--accent-soft);color:var(--accent)}
.badge.pro{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.adm-p{padding:20px 22px;margin-bottom:14px}.adm-t{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:70ch}
.adm-f{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.adm-f .field{flex:1 1 260px}.adm-f .btn{height:42px}
.btn.bad{border-color:var(--bad);color:var(--bad)}

.clk{cursor:pointer}.clk:hover td{background:var(--surface-2)}
.mail-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.badge.warn{color:#C9862A;background:color-mix(in srgb,#C9862A 12%,transparent)}
.mail-steps{margin:12px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--muted)}.mail-steps li{margin:0 0 8px}.mail-steps b{color:var(--fg)}.mail-steps a{color:var(--accent)}
.mail-steps code,.bal-n code{font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--fg)}
.mail-pv{width:100%;height:620px;border:0;border-radius:14px;background:#ECEFFA}
.mail-subj{margin:0;font-size:13px;line-height:1.45}.mail-subj span{color:var(--muted)}
.mail-on{display:flex;align-items:center;gap:8px;font-size:13.5px}
.pe-side:has(.mail-pv){position:sticky;top:14px}
.pe.pe-mail{grid-template-columns:minmax(0,1fr) minmax(360px,460px)}
@media (max-width:1000px){.pe.pe-mail{grid-template-columns:1fr}}
.bl-th{display:block;width:72px;height:38px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.bl-t{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.pe{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.pe-main,.pe-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.pe-p{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.pe-p .pk{margin:0}
.pe-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pe-row input{flex:1 1 200px}
.pe-url{text-transform:none;letter-spacing:0;font-family:var(--font);color:var(--muted);margin-left:6px}.pe-url b{color:var(--accent);font-weight:600}
.pe-h{font-size:12px;color:var(--muted);line-height:1.5}
.pe-tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tb{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer}.tb:hover{border-color:var(--accent);color:var(--accent)}
select.tb{max-width:240px}
#pBody{min-height:520px;font-family:var(--font-mono);font-size:13px;line-height:1.65;height:auto!important;padding:14px!important}
.pe-prev{min-height:520px;padding:18px 22px;border-radius:14px;background:var(--surface-2);font-size:15.5px;line-height:1.7;overflow:auto}
.pe-prev h2{font-size:24px;margin:26px 0 10px}.pe-prev h3{font-size:18px;margin:20px 0 8px}.pe-prev p{margin:0 0 14px}
.pe-prev .note{padding:12px 16px;border-radius:14px;background:var(--accent-soft);margin:14px 0}.pe-prev blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent)}
.pe-prev .cta-b{display:inline-flex;padding:10px 20px;border:1.5px solid var(--fg);border-radius:999px;color:var(--fg);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.pe-cov{border-radius:14px;overflow:hidden;background:var(--surface-2);aspect-ratio:1200/630;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.pe-cov img{width:100%;height:100%;object-fit:cover;display:block}
.pe-up{cursor:pointer}
.pe-acts{display:flex;gap:8px;flex-wrap:wrap}.pe-acts .btn{flex:1 1 auto}
.cnt{font-style:normal;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);letter-spacing:0}.cnt.ok{color:var(--ok)}.cnt.warn{color:var(--bad)}
.serp{padding:14px 16px;border-radius:14px;background:var(--surface-solid);border:1px solid var(--hair)}
.serp p{margin:0}.serp-u{font-size:12px;color:var(--muted)}.serp-t{font-size:18px;color:#1a0dab;line-height:1.3;margin:4px 0!important}[data-theme="dark"] .serp-t{color:#99c3ff}.serp-d{font-size:13px;color:var(--muted);line-height:1.5}
.doc-f{margin-bottom:14px}.doc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.doc-g .wide{grid-column:span 2}
@media (max-width:1000px){.pe{grid-template-columns:1fr}.doc-g{grid-template-columns:1fr}.doc-g .wide{grid-column:auto}}

.bal-warn{padding:14px 18px;margin-bottom:14px;font-size:13.5px;line-height:1.55}.bal-warn.bad{border-color:var(--bad);color:var(--bad)}.bal-warn a,.bal-n a{color:var(--accent)}
.bal-n{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}.bal-n.bad{color:var(--bad)}
.kpi.bad b{color:var(--bad)}
.bal-v .card{margin-bottom:14px}
.kpis5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}

/* drawer */
.dr-bg{position:fixed;inset:0;z-index:40;background:rgba(5,5,14,.45);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.dr{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px,100%);overflow:auto;padding:26px 24px 40px;background:var(--pop-bg);backdrop-filter:saturate(180%) blur(36px);-webkit-backdrop-filter:saturate(180%) blur(36px);border-left:1px solid var(--hair);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dr.in{transform:none}.dr-bg.in{opacity:1}
.dr .x{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:18px}
.dr h2{font-weight:300;font-size:26px;margin:6px 48px 4px 0;word-break:break-all}
.dr .meta{color:var(--muted);font-size:13px;margin-bottom:18px}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair)}
.sec h3{font-size:14px;font-weight:500;margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv span{color:var(--muted)}
.mini{width:100%;font-size:13px}.mini td{padding:8px 6px;cursor:default}
.confirm{margin-top:12px;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 6%,transparent);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:999px;background:var(--pop-bg);border:1px solid var(--hair);box-shadow:var(--shadow);font-size:13.5px;transition:all .25s;pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}
.load{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:12px}.side{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;padding:12px}.side .who,.side .sp{display:none}.logo{width:100%;font-size:28px}.navb{width:auto;padding:9px 12px;font-size:13.5px}.navb em{margin-left:6px}.side-acts{width:100%}.fg{grid-template-columns:1fr}}
.pe-en summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pe-en summary::-webkit-details-marker{display:none}.pe-en[open] summary{margin-bottom:14px}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="panel">
  <p class="pk">[ CODE · Адмінпанель ]</p>
  <h1 id="gTitle">Вхід</h1>
  <p id="gText">Доступ лише для адміністраторів CODE.</p>
  <div id="gForm">
    <div id="gisBox" style="display:flex;justify-content:center;min-height:44px"></div><button class="btn ghost" type="button" id="gGoogle" hidden>Увійти через Google</button>
    <p class="err" id="gStat" hidden></p>

function bars(days){

const usd=n=>'$'+(Math.round((n||0)*100)/100).toFixed(2);
const KIND={reading:'Трактування Таро',follow:'Уточнення до розкладу',chat:'«Запитай свою матрицю»',report:'Персональний розбір',year:'Прогноз на 12 місяців',photo:'Розпізнавання фото'};
function balEst(){
  const top=D.topups.reduce((a,t)=>a+(+t.usd||0),0), from=D.topups.length?D.topups[0].d:null;
  const spent=from?D.spend.filter(x=>isoDay(x.created_at)>=from).reduce((a,x)=>a+(+x.cost||0),0):0;
  const wk=D.spend.filter(x=>new Date(x.created_at)>=Date.now()-7*864e5).reduce((a,x)=>a+(+x.cost||0),0)/7;
  const priced=D.spend.filter(x=>x.cost!=null), avgReq=priced.length?priced.reduce((a,x)=>a+(+x.cost||0),0)/priced.length:0;
  const left=top-spent; return {has:D.topups.length>0,top,spent,left,perDay:wk,days:wk>0?Math.floor(left/wk):null,avgReq,reqLeft:avgReq>0?Math.floor(left/avgReq):null,from};
}
function vBal(){
  const b=balEst(), today=isoDay(Date.now());
  const dayCost=d=>D.spend.filter(x=>isoDay(x.created_at)===d).reduce((a,x)=>a+(+x.cost||0),0);
  const days=[]; for(let i=29;i>=0;i--) days.push(isoDay(Date.now()-i*864e5)); const vals=days.map(dayCost), mx=Math.max(0.0001,...vals);
  const m30=D.spend.filter(x=>new Date(x.created_at)>=Date.now()-30*864e5), noCost=m30.filter(x=>x.cost==null).length;
  const by={}; m30.filter(x=>x.cost!=null).forEach(x=>{ const k=by[x.kind]=by[x.kind]||{n:0,c:0,i:0,o:0}; k.n++; k.c+=+x.cost; k.i+=x.tokens_in||0; k.o+=x.tokens_out||0; });
  const low=b.has&&(b.left<2||(b.days!=null&&b.days<7));

async function loadAn(){
  const from=new Date(Date.now()-(AN.days-1)*864e5); from.setHours(0,0,0,0);
  const {data,error}=await SB.from('visits').select('created_at,sid,first,path,ref,src,medium,campaign,device,country').gte('created_at',from.toISOString()).order('created_at',{ascending:false}).limit(100000);
  AN.rows=data||[]; AN.err=error&&error.message; AN.loaded=Date.now();

function anTop(rows,keyFn,nameFn,limit=12){
  const m={}; rows.forEach(r=>{ const k=keyFn(r); if(k==null||k==='') return; const o=m[k]=m[k]||{s:new Set(),n:0}; o.s.add(r.sid); o.n++; });
  const tot=new Set(rows.map(r=>r.sid)).size||1;
  const L=Object.entries(m).map(([k,o])=>({k,v:o.s.size,n:o.n})).sort((a,b)=>b.v-a.v||b.n-a.n).slice(0,limit), mx=L.length?L[0].v:1;
  return L.length?`<div class="an-list">${L.map(x=>`<div class="an-r"><span class="an-n" title="${esc(nameFn?nameFn(x.k):x.k)}">${esc(nameFn?nameFn(x.k):x.k)}</span><span class="an-b"><i style="width:${Math.max(2,x.v/mx*100)}%"></i></span><b>${x.v}</b><small>${Math.round(x.v/tot*100)}%</small></div>`).join('')}</div>`:'<p class="empty">Поки немає даних.</p>';
}
const anChan=r=>{ const s=r.src||'', m=(r.medium||'').toLowerCase();
  if(/^(cpc|ppc|paid|ads?|paid[_-]?social|banner|target)$/.test(m)) return 'Реклама';
  if(/^(google|bing|duckduckgo|yahoo|ecosia)$/.test(s)) return 'Пошук (органічний)';
  if(/^(tiktok|instagram|facebook|threads|telegram|youtube|pinterest|x|viber|whatsapp|linkedin)$/.test(s)) return 'Соцмережі та месенджери';
  if(s==='ai') return 'ШІ-чати'; if(s==='email') return 'Email';

  d.querySelector('#pAdd').onclick=async e=>{ const b=e.currentTarget, amt=parseInt(d.querySelector('#pAmt').value||'0',10), kind=d.querySelector('#pKind').value;
    if(!(amt>0)){ toast('Вкажіть суму.'); return; } b.disabled=true;
    const {error}=await SB.from('payments').insert({user_id:id,email:u.email,amount:amt,kind,plan:kind==='pack'?null:d.querySelector('#sPlan').value,period:kind==='pack'?null:d.querySelector('#sPer').value,provider:'admin',note:d.querySelector('#pNote').value.trim()||null});
    if(error){ toast('Не вдалося: '+error.message); b.disabled=false; return; }
    await logA(kind==='refund'?'повернення записано':'оплату записано',u,{amount:amt,kind}); toast('Запис додано.'); close(); await load(); go(VIEW); };
  d.querySelector('#uDel').onclick=()=>{ const c=d.querySelector('#uDelC'); c.innerHTML=`<div class="confirm">Щоб підтвердити, введіть email користувача:<div class="field" style="margin-top:8px"><input id="uDelE" placeholder="${esc(u.email)}"></div><div class="row"><button class="btn bad sm" id="uDelGo">Видалити назавжди</button></div></div>`;
    c.querySelector('#uDelGo').onclick=async()=>{ if(c.querySelector('#uDelE').value.trim().toLowerCase()!==(u.email||'').toLowerCase()){ toast('Email не збігається.'); return; }
      const r1=await SB.from('subscriptions').delete().eq('user_id',id), r2=await SB.from('user_data').delete().eq('id',id);
      if(r1.error||r2.error){ toast('Помилка: '+(r1.error||r2.error).message); return; }
      await logA('дані користувача видалено',u,null); toast('Дані видалено.'); close(); await load(); go(VIEW); }; };
}

SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN') setTimeout(()=>{ if($('#app').hidden) boot(); },0); });
boot();
})();
</script>
</body>
</html>
