<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сторінку не знайдено · CODE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..500&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem("code-theme")||"null");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#ECEFFA;--fg:#14162B;--muted:#6A6F8C;--line:rgba(70,80,170,.2);--accent:#4F5BF2;--accent-2:#8A5CF6;--accent-3:#2BBBE6;--star:96,92,214;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05050C;--fg:#EEF0FF;--muted:#9295B4;--line:rgba(176,166,255,.22);--accent:#8C7DFF;--accent-2:#B47CFF;--accent-3:#4FD3F0;--star:226,230,255;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05050C;--fg:#EEF0FF;--muted:#9295B4;--line:rgba(176,166,255,.22);--accent:#8C7DFF;--accent-2:#B47CFF;--accent-3:#4FD3F0;--star:226,230,255;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:fixed;left:50%;top:44%;width:min(900px,120vw);height:260px;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 45%,transparent),transparent),radial-gradient(closest-side at 30% 50%,color-mix(in srgb,#FF5CC8 30%,transparent),transparent),radial-gradient(closest-side at 72% 50%,color-mix(in srgb,var(--accent-3) 35%,transparent),transparent);
 filter:blur(40px);opacity:.55;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-46%,-52%) scale(1.06);opacity:.7}}
main{position:relative;z-index:1;text-align:center;max-width:620px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font-family:Unbounded,sans-serif;font-weight:200;font-size:clamp(72px,22vw,190px);line-height:.9;letter-spacing:-.04em;margin:0;
 background:linear-gradient(110deg,var(--fg) 20%,var(--accent) 50%,var(--accent-3) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:Unbounded,sans-serif;font-weight:300;text-transform:uppercase;font-size:clamp(18px,4.4vw,28px);letter-spacing:-.01em;margin:22px 0 12px}
p.lead{color:var(--muted);font-size:16px;line-height:1.65;margin:0 auto 30px;max-width:44ch}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;text-decoration:none;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
a.go{color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));box-shadow:0 14px 34px -14px var(--accent)}
a.ghost{color:var(--fg);border:1px solid var(--line)}
a.btn:hover{opacity:.92}
.mail{margin-top:30px;font-size:13px;color:var(--muted)}
.mail a{color:var(--fg)}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main>
  <p class="eyebrow">[ CODE ] · помилка 404</p>
  <h1>404</h1>
  <h2>Цей код не розшифровано</h2>
  <p class="lead">Сторінки за цією адресою немає — можливо, посилання застаріло або в ньому помилка. Поверніться на головну й розрахуйте свій код.</p>
  <div class="acts"><a class="btn go" href="/">На головну</a><a class="btn ghost" href="/" onclick="history.length>1&&(event.preventDefault(),history.back())">Назад</a></div>
  <p class="mail">Щось не так? Напишіть нам: <a href="mailto:code.matrix.support@gmail.com">code.matrix.support@gmail.com</a></p>
</main>
<script>
(()=>{const cv=document.getElementById('sky'),cx=cv.getContext('2d');let W,H,st=[];const rgb=()=>getComputedStyle(document.documentElement).getPropertyValue('--star').trim()||'226,230,255';
const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);st=Array.from({length:Math.round(W*H/14000)},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.3,p:Math.random()*6,s:.0006+Math.random()*.0012}))};
const f=t=>{cx.clearRect(0,0,W,H);const c=rgb();for(const s of st){cx.globalAlpha=.25+.6*(.5+.5*Math.sin(t*s.s+s.p));cx.fillStyle=`rgb(${c})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(f)};
size();addEventListener('resize',size);requestAnimationFrame(f)})();
</script>
</body>
</html>
